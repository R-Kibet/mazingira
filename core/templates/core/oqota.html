{% extends "core/base.html" %}
{% load static %}

{% block title %}Oqota | Mazingira Sustainability Village{% endblock %}
{% block body_class %}page-dark-header{% endblock %}

{% block content %}

<!-- HERO -->
<section class="program-hero">
    <img src="{% static 'core/images/oq.png' %}" alt="Oqota programme" class="program-hero-img">
</section>

<!-- ABOUT -->
<section class="program-intro">
    <div class="container">
        <h1 class="program-heading">{{ page_heading }}</h1>
        <p class="program-subheading">{{ page_subheading }}</p>

        <div class="program-icon">
            <img src="{% static 'core/images/oq1.png' %}" alt="">
        </div>
    </div>
</section>

{% endblock %}
